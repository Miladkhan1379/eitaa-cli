name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev,media]"
      - name: Compile
        run: python -m compileall -q src/eitaa_cli
      - name: Tests
        run: pytest -q
      - name: Ruff
        continue-on-error: true
        run: ruff check src tests
      - name: Mypy
        continue-on-error: true
        run: mypy src/eitaa_cli
