name: Feature request
description: Suggest a high-level feature or Telethon-like helper
title: "feat: "
labels: ["feature"]
body:
  - type: textarea
    id: usecase
    attributes:
      label: Use case
      description: What workflow should become easier?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed CLI / API
      description: Show the command or Python API you would like.
      render: shell
  - type: dropdown
    id: priority
    attributes:
      label: Suggested priority
      options: [P0, P1, P2, P3]
  - type: checkboxes
    id: protocol
    attributes:
      label: Protocol evidence
      options:
        - label: I know this capability exists in the bundled Eitaa schema or captured web client.
        - label: This is a convenience feature composed from existing supported methods.
