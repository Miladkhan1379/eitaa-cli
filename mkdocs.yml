site_name: Eitaa CLI
site_description: Async, typed command-line client for Eitaa's TL-over-HTTPS API
repo_name: eitaa-cli
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Authentication and OTP: authentication.md
  - Error handling and retries: error-handling.md
  - Search and exploration: search-and-exploration.md
  - Conversations: conversations.md
  - CLI reference: usage.md
  - Python API: python-api.md
  - Architecture and typing: architecture-and-typing.md
  - Protocol:
      - Schema files: schema.md
      - Wire protocol: protocol.md
      - HTTP profile: http-profile.md
      - Coverage: coverage.md
  - Operations:
      - Security: security.md
      - Troubleshooting: troubleshooting.md
      - Development: development.md
markdown_extensions:
  - admonition
  - tables
  - fenced_code
  - toc:
      permalink: true
