[project]
name = "eitaa-cli"
version = "0.3.0"
description = "Direct Python CLI and async client for Eitaa Web's TL-over-HTTPS API."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Local project" }]
dependencies = [
  "httpx>=0.27,<1.0",
  "rich>=13.7,<15.0",
  "typer>=0.12,<1.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2.0",
  "pytest>=8.3,<10.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.6,<1.0",
]
media = [
  "Pillow>=10.4,<12.0",
  "mutagen>=1.47,<2.0",
]
docs = [
  "mkdocs>=1.6,<2.0",
  "mkdocs-material>=9.5,<10.0",
]

[project.scripts]
eitaa = "eitaa_cli.cli.main:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eitaa_cli = ["data/*.json", "data/*.tl"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ANN"]
ignore = ["ANN401", "B008", "E501", "PLR2004"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
